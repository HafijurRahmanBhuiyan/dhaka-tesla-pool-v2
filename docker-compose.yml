version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Database Service (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dhaka_pool_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  # ---------------------------------------------------------------------------
  # 2. Backend API Service (Node.js / Express)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhaka_pool_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres_dev_password@db:5432/dhaka_tesla_pool}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_32chars}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app_network

  # ---------------------------------------------------------------------------
  # 3. Frontend Web Service (React / Vite Dev Server)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhaka_pool_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_network

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  app_network:
    driver: bridge
